# SSH 插件配置示例：纯环境变量凭据（不落盘、不写凭据库）
# ─────────────────────────────────────────────────────────────────────────────
# 适合 CI、容器、以及「密码由外部注入、DSH 只读」的部署。
# 本配置下插件**绝不写**任何凭据库：`setSecret` 会以 SSH_CFG_INVALID 明确拒绝，
# 而不是静默地把密码存进某个文件。
#
#   - id: dsh-ssh
#     name: '@local/dsh-ssh'
#     config:
#       secrets:
#         provider: env
#         envPrefix: DSH_SSH_

secrets:
  provider: env             # 只读环境变量；ctx.credentials 完全不被读取
  envPrefix: DSH_SSH_

# 档案本身仍留在磁盘上（只存引用名/主机信息，无明文）。
profilesFile: ''            # '' → <DSH_HOME>/dsh-ssh/profiles.json
auditFile: ''

# 主机密钥：CI 场景通常预置 known_hosts；若目标主机是每次新建的临时环境，
# 用 accept-new（首次自动记录），但**不要**用 insecure —— 那等于关掉中间人防护。
hostKey:
  policy: accept-new
  knownHostsFile: ''        # '' → <DSH_HOME>/known_hosts

logging:
  level: info
  redact: true

# ─────────────────────────────────────────────────────────────────────────────
# 环境变量命名规则（与 src/credentials.ts 的 profileSlug() 一致）：
#
#   DSH_SSH_<PROFILE_SLUG>_PASSWORD
#   DSH_SSH_<PROFILE_SLUG>_PASSPHRASE
#
# <PROFILE_SLUG> = 档案名的**大写**形式，非字母数字一律折叠成下划线：
#
#   档案 "prod"            → DSH_SSH_PROD_PASSWORD
#   档案 "prod web-01"     → DSH_SSH_PROD_WEB_01_PASSWORD
#   档案 "10.0.0.1"（无名）→ DSH_SSH_10_0_0_1_PASSWORD
#
# 档案里显式写了 `secretRefs.password: MY_REF` 时，变量名就是 MY_REF 本身。
#
# 例：
#   export DSH_SSH_PROD_PASSWORD='...'
#   export DSH_SSH_PROD_PASSPHRASE='...'
#
# 优先级（高 → 低，ICD §6 冻结）：
#   1. 环境变量      → UI 显示 source: 'env'（只读、不可回显）
#   2. 凭据库记录    → source: 'keychain'
#   3. 会话内存      → source: 'profile'（setSecret(persist:false)）
#   4. 一次性输入    → source: 'profile'（connect 的 secrets 参数，仅本次连接）
#
# 注意：环境变量层是**启动时快照**，运行中 export 不会生效，需重启 DSH。
