# Continuous integration for @local/dsh-ssh.
#
# Two things this workflow exists to catch, both learned the hard way while
# building the plugin:
#
#   1. `lib/` is committed (DSH consumes the built `lib/index.js` and
#      `lib/client.js` directly), so a source change that was never rebuilt ships
#      stale bytes to every user. `build-client.mjs --check` and the generated
#      mirrors make that drift a red build instead of a silent one.
#   2. The client half loads `lib/client.js` in most component tests, so the build
#      must precede those tests. That is the R8 order enforced below: unit tests
#      first, then the build, then the client suite against the real artifact.
#
# Env-gated suites (real SSH target, OpenSSH interop) skip themselves when their
# variables are absent — but "skips itself" and "CI is green" are not the same
# claim: `node --test` exits 0 when a whole file skips. The OpenSSH interop file,
# which is the only out-of-tree truth source for known_hosts, therefore has its
# own step below that asserts the counts instead of trusting the exit code. The
# real-target suite stays opt-in and is not run here at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v4

      # `npm ci` used to guard the install behind a `|| npm install` fallback, but
      # this repository has no package-lock.json (only pnpm-lock.yaml), so `npm ci`
      # failed every run and the fallback silently performed an unlocked install.
      # The lockfile that actually exists is now the one CI installs from, and the
      # fallback is gone so a broken install fails loudly instead of quietly
      # resolving whatever the registry serves that day.
      #
      # pnpm 10 (not 11): package.json declares `engines.node >= 20` and the matrix
      # below still runs Node 20, while pnpm 11+ requires Node >= 22.13. 10.34.5
      # reads this lockfile (lockfileVersion 9.0) and covers both legs.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # `--frozen-lockfile`: the lockfile is the contract. It is verified in sync
      # with package.json locally (`pnpm install --frozen-lockfile --lockfile-only`).
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      # The build comes before every test on purpose: `lib/**` is committed, and
      # the suites import the implementation from `lib/**`, so testing first would
      # test whatever happens to be committed rather than the sources in this
      # checkout. With the build here, a stale committed artifact can no longer
      # masquerade as a test failure — the "Fail if the build dirtied the tree"
      # step at the end reports it for what it is.
      - name: Build host half + client bundle
        run: pnpm run build

      - name: Generated artifacts are in sync
        run: |
          node scripts/build-client.mjs --check
          test -f locale/zh.json && test -f locale/en.json
          test -f client/src/chrome/locale.gen.js

      - name: Unit tests (host half)
        run: pnpm run test:unit

      - name: Client tests (against the built bundle)
        run: pnpm run test:client

      - name: Web half — the client bundle mounts into the sidebar slots
        # The web end is the half a browser profile loads, so its contract gets a
        # named gate of its own rather than being one anonymous file inside the
        # client suite above: the built bundle must register under the manifest
        # package name, need nothing but `react`, and mount the tab body and title
        # under the manifest's tabId. A real browser is not started here — CI has
        # no DSH web shell to load the plugin into, and a hand-rolled mock of one
        # would only prove the mock; the end-to-end check is `profile-install.mjs
        # --check` against a real profile (README §1.3).
        run: node --test --test-concurrency=1 test/client/web-mount.test.mjs

      - name: Integration tests (env-gated suites skip)
        run: pnpm run test:integration

      # `node --test` exits 0 when every case in a file skips, so this file — the
      # only out-of-tree truth source for known_hosts (it cross-checks our
      # fingerprints against the real ssh-keygen) — could stay green while
      # executing nothing. The probe in the file now finds ssh-keygen on POSIX
      # too; this step asserts the counts so a silent regression to "all skipped"
      # is a red build. It reuses the same parser verify-all reports with, and
      # writes its report outside the repository so the dirty-tree gate below
      # stays meaningful.
      - name: OpenSSH interop must execute, not skip
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/openssh-interop.txt"
          node --test --test-concurrency=1 --test-force-exit test/integration/openssh-interop.test.mjs > "$report" 2>&1 || { cat "$report"; exit 1; }
          cat "$report"
          REPORT="$report" node --input-type=module -e '
            import { readFileSync } from "node:fs"
            import { resolve } from "node:path"
            import { pathToFileURL } from "node:url"
            const { parseTestCounts } = await import(pathToFileURL(resolve("scripts/verify-all.mjs")).href)
            const counts = parseTestCounts(readFileSync(process.env.REPORT, "utf8").split(/\r?\n/))
            console.log("openssh-interop counts:", JSON.stringify(counts))
            if (!counts) {
              console.error("::error::openssh-interop produced no test counts — the reporter output could not be parsed")
              process.exit(1)
            }
            if (counts.skipped > 0 || counts.passed === 0) {
              console.error(`::error::openssh-interop executed nothing useful (passed=${counts.passed}, skipped=${counts.skipped}) — the only out-of-tree known_hosts truth source is dead`)
              process.exit(1)
            }
          '

      - name: Contract gate — ICD §4 method table
        run: DSH_SSH_STRICT_ICD=1 node --test --test-concurrency=1 test/integration/icd-conformance.test.mjs

      - name: Lint
        run: node scripts/lint.mjs

      - name: Fail if the build dirtied the tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the build changed tracked files — commit the regenerated artifacts"
            git --no-pager diff --stat
            exit 1
          fi
